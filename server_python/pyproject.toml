[project]
name = "adskip-server-python"
version = "0.0.1"
description = "AdSkip 规则中心的 Python 服务原型（规则审核服务脚手架，对应 docs/ROADMAP-ADS.md）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
