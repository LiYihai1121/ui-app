# Version Catalog —— 本项目所有插件/依赖版本的唯一事实源。
#
# 修订方式：升级前先核对阿里云镜像 maven-metadata（docs/development/DEV-ENVIRONMENT.md），
# 再改本文件；禁止在模块 build 脚本里硬编码任何版本号。
# 设计依据见 docs/planning/DESIGN-BUILD-FRAMEWORK.md 阶段 B。

[versions]
# 构建工具链（版本互相有硬性兼容关系，升级前先对照官方兼容矩阵）
agp = "9.4.1"                        # Android Gradle Plugin（Gradle 9.6+ 移除了 AGP 8.x 依赖的内部 API，必须 9.x；
                                     # AGP 9 内置 Kotlin 2.2.10，kotlin.android 插件不得再单独应用；镜像已核对）
kotlin = "2.2.10"                   # 仅用于 Compose 编译器插件：必须与 AGP 9.4.1 内置 Kotlin 版本一致

# AndroidX（BOM 之外的坐标也统一收口）
# 官方明确要求「always use the latest Compose BOM」：BOM 是同一时刻各 Compose 库
# 互相兼容的快照，单独升某个库反而会制造不匹配组合。
composeBom = "2026.08.00"           # Jetpack Compose BOM（core 1.12 + material3 1.5 Expressive：Mesh Gradients、
                                     # Wide Color Gamut、Grid 具名区域；compose 1.12 起强制 compileSdk 37，
                                     # 故本 BOM 必须与约定插件的 compileSdk 同步抬升；镜像已核对）
activityCompose = "1.9.3"
lifecycle = "2.8.7"                 # lifecycle-viewmodel-compose / lifecycle-runtime-compose
navigationCompose = "2.8.5"

# 测试
junit = "4.13.2"

# 安全存储（EncryptedSharedPreferences）
securityCrypto = "1.1.0-alpha07"

# 网络层（FOLLOW-UP P0 证书锁定 / P3 连接池、Keep-Alive、重试）；
# 经 OkHttp 统一收口，替代裸 HttpURLConnection；配套 MockWebServer 做网络层单测
okhttp = "4.12.0"                       # okhttp 4.x 最新稳定版；5.x 仍处 alpha，暂不引入
                                        # 客户端 zero-dep 承诺由此调整为「除 AndroidX / security-crypto 外仅引入 OkHttp」

# 静态检查（构建期工具，不进运行时依赖，故不影响「客户端零第三方依赖」承诺）
ktlint = "14.2.0"                   # ktlint-gradle 包装插件；其默认内含的 ktlint 版本会随补丁版变动，
                                    # 故下方显式锁定 ktlint 本体版本，避免「同一提交不同时间跑出不同结果」
ktlintCli = "1.8.0"                 # ktlint 本体版本（ktlint_standard_* 规则集随此版本演进）

# 约定插件自身版本（随发布节奏递增；被 libs.plugins.adskip-android-application 引用）
adskipPlugins = "1.0.0"

[libraries]
# AndroidX Compose（版本由 BOM 控制，此处不写版本号）
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# compose 1.9+ 起 material3 不再传递依赖图标库，需显式声明 core 图标集
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
# 注意：底部导航栏**刻意不使用** material-icons-extended。该制品体积巨大，
# 实测让 assembleDebug 的 dex 合并多花数分钟、debug APK 增大 ~7 MB，
# 对本项目（轻量工具 + assembleDebug 作为 CI 门禁）不划算；改用 core 图标集。

# AndroidX MVVM + 导航
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# 测试
junit = { group = "junit", name = "junit", version.ref = "junit" }

# 安全存储
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# 网络层（连接池/Keep-Alive/重试/证书锁定）
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# 证书锁定测试（HeldCertificate / HandshakeCertificates）
okhttp-tls = { group = "com.squareup.okhttp3", name = "okhttp-tls", version.ref = "okhttp" }
# 网络层测试（测试期依赖，不进 APK）
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

# build-logic 约定插件运行时依赖（供 build-logic/convention 将 AGP/Compose 编译器/ktlint 插件应用到目标工程）
# 注意：id 标注的插件应用走 pluginManagement 仓库解析，这里要求的是构成 classpath 的实际制品坐标
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-compose-compiler-plugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
# 注意：这里用插件**本体**坐标而非 `*.gradle.plugin` marker 制品。
# marker 只发布在 Gradle Plugin Portal，而本项目的仓库解析以阿里云镜像优先
# （build-logic/settings.gradle.kts），marker 在镜像上缺失会导致约定插件编译期解析失败；
# 本体制品在 Maven Central 与镜像上都有，且约定插件本来就是以 pluginManager.apply(id) 应用它。
ktlint-gradle = { group = "org.jlleitschuh.gradle", name = "ktlint-gradle", version.ref = "ktlint" }
# ktlint 本体（运行时由 ktlint-gradle 在 code-analysis 任务里下载）
ktlint-cli = { group = "com.pinterest.ktlint", name = "ktlint-cli", version.ref = "ktlintCli" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
adskip-android-application = { id = "adskip.android.application", version.ref = "adskipPlugins" }
