name: CI

on:
  push:
    branches: [ main, codex/github ]
  pull_request:
    branches: [ main ]

jobs:
  android:
    name: Android Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

  server:
    name: Server Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run unit tests
        run: node test/unit.js

      - name: Start server and run smoke tests
        run: |
          ADMIN_TOKEN=ci-test-token HOST=127.0.0.1 node server.js &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3210/api/v1/health >/dev/null && break
            sleep 1
          done
          ADMIN_TOKEN=ci-test-token BASE_URL=http://127.0.0.1:3210 node test/smoke.js
