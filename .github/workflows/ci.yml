name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android:
    name: Android Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/android-build.log

      - name: Run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee /tmp/android-test.log

      - name: Build release APK and verify it is signed
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/android-release-build.log
          # 无签名配置时必须回退 debug 签名，产物必须可安装（未签名 APK 在手机上报「解析软件包时出现问题」，Issue #23）
          apksigner="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner | sort | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload Android logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-logs
          path: |
            /tmp/android-build.log
            /tmp/android-test.log
            /tmp/android-release-build.log
          if-no-files-found: ignore

  server:
    name: Server Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Run typecheck
        run: bun run typecheck
