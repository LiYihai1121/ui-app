name: CI

on:
  push:
    branches: [ main, codex/github ]
  pull_request:
    branches: [ main ]

jobs:
  android:
    name: Android Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/android-build.log

      - name: Run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee /tmp/android-test.log

      - name: Upload Android logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-logs
          path: |
            /tmp/android-build.log
            /tmp/android-test.log
          if-no-files-found: ignore

  server:
    name: Server Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run unit tests
        run: node test/unit.js

      - name: Start server and run smoke tests
        run: |
          ADMIN_TOKEN=ci-test-token HOST=127.0.0.1 node server.js > /tmp/server.log 2>&1 &
          ok=0
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3210/api/v1/health >/dev/null && { ok=1; break; }
            sleep 1
          done
          if [ "$ok" = "0" ]; then
            echo "::error::Server failed to start within 30s"
            cat /tmp/server.log
            exit 1
          fi
          set +e
          ADMIN_TOKEN=ci-test-token BASE_URL=http://127.0.0.1:3210 node test/smoke.js > /tmp/smoke.log 2>&1
          SC=$?
          set -e
          cat /tmp/smoke.log
          grep -E '✘|✗' /tmp/smoke.log | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit $SC

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: /tmp/*.log
          if-no-files-found: ignore
