name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  structure:
    name: Structure Contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37 build-tools;36.0.0'

      - name: Run architecture & structure contract tests
        # 只跑 arch 包下的守护测试：失败要在几分钟内暴露，而不是等完整 Android 构建跑完。
        # 覆盖 ProjectStructureTest（目录/产物/模块/包结构）、ArchitectureBoundaryTest（包边界）、
        # ManifestContractTest（Manifest 契约）、RepoHygieneTest（仓库卫生）。
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests 'com.ldp.adskip.arch.*' --no-daemon 2>&1 | tee /tmp/android-contract.log

      - name: Upload contract logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-contract-logs
          path: |
            /tmp/android-contract.log
          if-no-files-found: ignore

  android:
    name: Android Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 与约定插件同源：compileSdk 37（compose 1.12 强制）+ AGP 9.4 要求的 build-tools 36.0.0。
          # 曾长期停留在 android-35 / build-tools 35.0.0，靠 Gradle 自动解析兜住——
          # 那是「靠工具兜底」而不是「显式声明」，AGP 一收紧校验就会在 CI 上突然失败。
          packages: 'platforms;android-37 build-tools;36.0.0'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle and dependency cache
        # gradle/actions/setup-gradle 自动以 wrapper、settings、version catalog 与全部构建脚本为缓存键，
        # 覆盖了新增的 gradle/libs.versions.toml 与 build-logic/（手写 actions/cache key 无法跟踪这些「第二事实源」）。
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: true

      - name: Run ktlint (formatting & static checks)
        # 放在构建之前：格式/静态问题无需等 assembleDebug 跑完两分钟就能失败
        run: |
          set -o pipefail
          ./gradlew ktlintCheck --no-daemon 2>&1 | tee /tmp/android-ktlint.log

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/android-build.log

      - name: Run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee /tmp/android-test.log

      - name: Build release APK and verify it is signed
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/android-release-build.log
          # 无签名配置时必须回退 debug 签名，产物必须可安装（未签名 APK 在手机上报「解析软件包时出现问题」，Issue #23）
          apksigner="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner | sort | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload Android logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-logs
          path: |
            /tmp/android-ktlint.log
            /tmp/android-build.log
            /tmp/android-test.log
            /tmp/android-release-build.log
            app/build/reports/ktlint/
          if-no-files-found: ignore

  server:
    name: Server Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Run typecheck
        run: bun run typecheck
