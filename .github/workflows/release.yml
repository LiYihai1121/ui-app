name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: write

jobs:
  verify-history:
    name: Verify release history
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify annotated tag and commit object
        shell: bash
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git cat-file -t "$GITHUB_SHA")" = commit

      - name: Verify release versions
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]]; then
            base_version="${BASH_REMATCH[1]}"
            android_version="${base_version%.*}"
          else
            echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          server_version="$(node -p "require('./server/package.json').version")"
          android_version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' client/app/build.gradle.kts)"
          test "$server_version" = "$base_version"
          test "$android_version_name" = "$android_version"

      - name: Verify known workflow chain
        if: github.ref_name == 'v3.0.0'
        shell: bash
        run: |
          git merge-base --is-ancestor bdf31d5d328c9a146607bf4e3bdaa5e0dd84dcca c5cdac70bfb0394013dea6baee1470860eaac820
          git merge-base --is-ancestor c5cdac70bfb0394013dea6baee1470860eaac820 "$GITHUB_SHA"

  build-and-test:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs: verify-history
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build and test Android
        working-directory: client
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease testDebugUnitTest --no-daemon

      - name: Test server
        working-directory: server
        run: |
          bun install
          bun test
          bun run typecheck

      - name: Prepare release artifacts
        shell: bash
        run: |
          mkdir -p release
          apk_file="$(find client/app/build/outputs/apk/release -maxdepth 1 -type f -name 'app-release*.apk' -print -quit)"
          test -n "$apk_file"
          cp "$apk_file" "release/AdSkip-${GITHUB_REF_NAME}.apk"
          sha256sum release/*.apk > release/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
