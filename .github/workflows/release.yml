name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # 签名身份锚点（RELEASE-HISTORY.md 3.0.4 / 3.3.0 行，CN=AdSkip Release）：
  # 「有签名」不等于「签名者正确」——Secrets 被误配或替换成其他 keystore 时，
  # 仅 verify 会静默放行；此处硬性比对期望证书 SHA-256，不符即失败（SLSA 对齐）。
  EXPECTED_CERT_SHA256: 040d7afd0e288b7fe8df2aab43fb3f2b9b8eb458e88ab4d104d89921c9993edc

jobs:
  verify-history:
    name: Verify release history
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release tag input
        # workflow_dispatch 的 tag 是自由文本：先过白名单再进后续校验，
        # 防止误输入分支名/任意 ref 触发「重建发布」走到错误产物。
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Illegal release tag: ${RELEASE_TAG}（须形如 v3.4.0 或 v3.4.0-rc.1）" >&2
            exit 1
          fi

      - name: Verify annotated tag and commit object
        shell: bash
        run: |
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          release_commit="$(git rev-parse "$RELEASE_TAG^{}")"
          test "$(git cat-file -t "$release_commit")" = commit
          test "$release_commit" = "$(git rev-parse HEAD)"

      - name: Verify release versions
        shell: bash
        run: |
          tag_version="${RELEASE_TAG#v}"
          if [[ "$tag_version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]]; then
            base_version="${BASH_REMATCH[1]}"
            android_version="${base_version%.*}"
          else
            echo "Unsupported release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

          server_version="$(node -p "require('./server/package.json').version")"
          android_version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' client/app/build.gradle.kts)"
          test "$server_version" = "$base_version"
          test "$android_version_name" = "$android_version"

      - name: Verify known workflow chain
        if: env.RELEASE_TAG == 'v3.0.0'
        shell: bash
        run: |
          git merge-base --is-ancestor bdf31d5d328c9a146607bf4e3bdaa5e0dd84dcca c5cdac70bfb0394013dea6baee1470860eaac820
          release_commit="$(git rev-parse "$RELEASE_TAG^{}")"
          git merge-base --is-ancestor c5cdac70bfb0394013dea6baee1470860eaac820 "$release_commit"

  build-and-test:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs: verify-history
    permissions:
      contents: write # 仅本 job 创建 Release 需要写；其余 job 保持只读（最小权限）
    env:
      # 正式签名密钥（发布必需）：M2 起无签名时 assembleRelease 按 build.gradle.kts 三态策略
      # 直接失败（不再回退 debug 签名）；未配置 Secrets 则发布流程在此中断，绝不产出不可安装/可被冒签的制品
      ADSKIP_KEYSTORE_BASE64: ${{ secrets.ADSKIP_KEYSTORE_BASE64 }}
      ADSKIP_STORE_PASSWORD: ${{ secrets.ADSKIP_STORE_PASSWORD }}
      ADSKIP_KEY_ALIAS: ${{ secrets.ADSKIP_KEY_ALIAS }}
      ADSKIP_KEY_PASSWORD: ${{ secrets.ADSKIP_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Keep stable Build Tools aligned with ci.yml; API 37 is currently installed from beta below.
          packages: 'platform-tools build-tools;36.0.0'

      - name: Install Android 17 (API 37) platform from beta channel
        # Match ci.yml: this platform is currently in the beta repository and the package name includes .0.
        run: sdkmanager --install "platforms;android-37.0" --channel=1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Configure release signing (optional secrets)
        if: env.ADSKIP_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          printf '%s' "$ADSKIP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/adskip-release.keystore"
          {
            echo "adskip.storeFile=$RUNNER_TEMP/adskip-release.keystore"
            echo "adskip.storePassword=$ADSKIP_STORE_PASSWORD"
            echo "adskip.keyAlias=$ADSKIP_KEY_ALIAS"
            echo "adskip.keyPassword=$ADSKIP_KEY_PASSWORD"
          } >> client/local.properties
          echo "release keystore materialized from repository secrets"

      - name: Build and test Android
        working-directory: client
        run: |
          chmod +x gradlew
          # ktlintCheck 与 CI 保持同一门禁：发布制品不应绕过格式与静态检查
          ./gradlew ktlintCheck assembleRelease testDebugUnitTest --no-daemon

      - name: Test server
        working-directory: server
        run: |
          bun install
          bun test
          bun run typecheck

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          apk_file="$(find client/app/build/outputs/apk/release -maxdepth 1 -type f -name 'app-release*.apk' -print -quit)"
          test -n "$apk_file"

          # 未签名 APK 在手机上必然报「解析软件包时出现问题」（Issue #23）：此处硬性拦截，绝不发布不可安装的产物
          apksigner="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner | sort | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk_file" | tee /tmp/apksigner-verify.log

          # 核对期望证书指纹：签名者必须是 RELEASE-HISTORY 登记的 CN=AdSkip Release 证书，
          # 防止 Secrets 误配导致换钥重签仍被放行
          if ! grep -qi "$EXPECTED_CERT_SHA256" /tmp/apksigner-verify.log; then
            echo "::error::签名证书指纹与期望值不符（期望 $EXPECTED_CERT_SHA256）——检查 ADSKIP_KEYSTORE_* Secrets" >&2
            exit 1
          fi

          cp "$apk_file" "release/AdSkip-${RELEASE_TAG}.apk"
          sha256sum release/*.apk > release/SHA256SUMS

          {
            echo "### Release artifact"
            "$apksigner" verify --print-certs "$apk_file"
            cat release/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate changelog draft (dual-track release notes)
        # 双轨说明：
        #   轨一 = 下方 action 的 generate_release_notes（GitHub 按 PR 标题聚合）作为草稿描述；
        #   轨二 = 本步在发布链路内自动产出 Keep a Changelog 分节草稿 notes-draft.md，
        #          随 Release 上传，作为 CHANGELOG.md 人工定稿的输入物（CONTRIBUTING 发布核对清单）。
        shell: bash
        run: |
          set -euo pipefail
          prev_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]+.[0-9]+.[0-9]+' "${RELEASE_TAG}^{commit}^" 2>/dev/null || true)"
          if [ -n "$prev_tag" ] && [ "$prev_tag" != "$RELEASE_TAG" ]; then
            node scripts/generate-changelog.mjs "$prev_tag" "$RELEASE_TAG" > release/notes-draft.md
          else
            {
              echo "## Changelog 草稿（${RELEASE_TAG}）"
              echo ""
              echo "> 未找到上一版本 tag（首个版本或历史豁免线之前），本 Release 无自动草稿，CHANGELOG.md 条目全人工撰写。"
            } > release/notes-draft.md
          fi
          echo "prev_tag=${prev_tag:-<none>}"
          {
            echo "### Changelog 草稿（双轨第二轨，需人工定稿）"
            echo ""
            cat release/notes-draft.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # workflow_dispatch 重建时必须显式传 tag_name：缺省取 github.ref_name，
          # 手动触发时那是分支名 main，制品会挂到错误的 Release 或直接报错
          tag_name: ${{ env.RELEASE_TAG }}
          # 轨一：GitHub 自动说明作为 Release 描述草稿；轨二的 notes-draft.md 由
          # files: release/* 一并上传，CHANGELOG.md 由人工定稿（见 CONTRIBUTING 核对清单）
          generate_release_notes: true
          files: release/*
